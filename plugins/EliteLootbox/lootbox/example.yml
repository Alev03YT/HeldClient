Item:
  material: CHEST # Material of the lootbox
  data: 0 # ID/Data of the lootbox (leave 0 if you don't know)
  name: '&cExample Lootbox' # Display Name of the lootbox
  lore: # Lore of the lootbox
    - '&7This is an example lootbox'

Animation:
  type: 1 # Type of animation of the lootbox
  settings: # Settings will vary depending on the animation type
    title: '&cexample lootbox'
    rewards-slots:
    - 2
    - 3
    - 4
    bonus-rewards-slots:
    - 5
    - 6
    timer-slots:
    - 0
    - 8
    time: 5
    broadcast:
      enable: true
      header: '&e&l(!) &e{PLAYER} has just open the &c&lExample Lootbox &eand has
        gotten'
      message: '&6&l* &e&l{AMOUNT}x {ITEM}'
    sound:
      start: UI_BUTTON_CLICK:5
      prize: ENTITY_PLAYER_LEVELUP:5

skippable: true # Is the animation skippable?
reward-preview:
  enabled: true # Preview rewards when you left-click lootbox
  show-percents: true

rewards: []
bonus-rewards: []
