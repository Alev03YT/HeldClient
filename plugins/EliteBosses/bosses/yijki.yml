display: "&6&lYijki, World Destroyer &7| &c{HEALTH}♥" # Name of the boss (ontop of the entity) - Updates with the {HEALTH} placeholder
entity: "WITHER" # Entity of boss
health: 2000 # Max Health of boss

scoreboard:
  enabled: true
  ticks: 20 # How long before the scoreboard refreshes (20 = 1s)
  visible-range: 50 # How far from the boss to see the scoreboard in blocks
  # Variables for scoreboard
  # {HEALTH} - Show Bosses Health
  # {MAX-HEALTH} - Show Bosses Max Health
  # {PHASE} - Show Current Bosses Phase
  # {DAMAGE-DEALT} - How much damage the viewer has done
  # {DAMAGE-DEALT-PERCENT} - How much damage the viewer has done in a %
  # {MINION-COUNT} - Show how many minions are active
  title: "&6&lYijki, World Destroyer" # Title of scoreboard
  # Limit of scoreboard lines is 15 so be cautious
  lines:
    - ''
    - '&c&lHealth'
    - '&c{HEALTH}♥'
    - ''
    - '&e&lMinions'
    - '&e{MINION-COUNT}'
    - ''
    - '&a&lDamage Dealt'
    - '&a{DAMAGE-DEALT} &7[{DAMAGE-DEALT-PERCENT}%]'
    - ''

# Remove either SPAWN or DEATH if you do not want it to broadcast
broadcasts:
  # Broadcast on spawn
  SPAWN:
    - ''
    - '&e&l(!) &6Yijki, World Destroyer&e has been spawned'
    - '&eat &6{X}x&e, &6{Y}y&e, &6{Z}z &ein the &cWarzone&e!'
    - ''
  # Broadcast on death
  DEATH:
    - ''
    - '&e&l(!) &6Yijki, World Destroyer&e has been defeated'
    - '&eby these great warriors!'
    - '&6&l(!) Most Damage'
    - '&61. &e{PLAYER-1} &7({PLAYER-DAMAGE-1} DMG)'
    - '&62. &e{PLAYER-2} &7({PLAYER-DAMAGE-2} DMG)'
    - '&63. &e{PLAYER-3} &7({PLAYER-DAMAGE-3} DMG)'
    - ''

# Rewards given to top damagers
# Placeholder: {PLAYER}
# You can add chances to each command by adding <chance>;;<command>
# Example: 20;;give {PLAYER} emerald 1
rewards:
  1:
    - 'give {PLAYER} emerald 1'
  2:
    - 'give {PLAYER} diamond 1'
  3:
    - 'give {PLAYER} iron_ingot 1'

# Bosses are able to have multiple phases
phases:
  1:
    # Each phase can be activated on a min health value (if they regen health they can go back to a lower phase)
    # You should make the min health less than the max health and do not duplicate it in other phases
    min-health: 1750
    max-health: 2000
    # This will set the player that the boss will target
    # Available target types: RANDOM, CLOSEST, LOWEST_HEALTH, HIGHEST_HEALTH
    target-type: "RANDOM"
    effects:
      overall-chance: 30 # Overall chance of the effects activating
      values:
        # There are currently two types of effects DEFENSE & ATTACK & PHASE
        # DEFENSE = When the boss is attacked by a player
        # ATTACK = When the boss attacks a player
        # PHASE = When the boss changes phase
        #
        # Effects are done with percentages so 'PERCENT;EFFECT', if you do not
        # include a percent it is automatically made to execute ONCE (one time) 100%
        #
        # You can add multiple effects on one line by separating them via ### (do not include the chance [20;])
        # You can also add messages to any effect to send to a radius adding :<message=radius>your message</message> to the end of your effect
        # ie. <message=5>This is a message</message> will send that message to players in a radius of 5 blocks
        DEFENSE:
          - '20;MINIONS:WITHER_SKELETON:15:DIAMOND:5:&c&lUndead Minion:4:20:SPEED-3,INCREASE_DAMAGE-1'
          - '5;CAGE:WATER:STONE:30'
          - '5;CAGE:LAVA:STONE:30'
        PHASE:
          - 'IMMUNE:SWORD###IMMUNE:PROJECTILE###IMMUNE:POTION:<message=50>&f&l(&6&lYijki, World Destroyer&f&l) &fYijki has activated Axes only! You can only damage him using axes</message>'
          - 'POTION:INCREASE_DAMAGE:3:BOSS'
          - 'POTION:SPEED:5:BOSS'
  2:
    min-health: 1500
    max-health: 1749
    target-type: "RANDOM"
    effects:
      overall-chance: 30
      values:
        DEFENSE:
          - '20;MINIONS:WITHER_SKELETON:15:DIAMOND:5:&c&lUndead Minion:4:20:SPEED-3,INCREASE_DAMAGE-1'
          - '5;CAGE:WATER:STONE:30'
          - '5;CAGE:LAVA:STONE:30'
        PHASE:
          - 'POTION:INCREASE_DAMAGE:3:BOSS'
          - 'POTION:SPEED:5:BOSS'
          - 'IMMUNE:AXE###IMMUNE:PROJECTILE###IMMUNE:POTION:<message=50>&f&l(&6&lYijki, World Destroyer&f&l) &fYijki has activated Swords only! You can only damage him using swords</message>'
  3:
    min-health: 1400
    max-health: 1499
    target-type: "RANDOM"
    effects:
      overall-chance: 30
      values:
        DEFENSE:
          - '20;MINIONS:WITHER_SKELETON:15:DIAMOND:5:&c&lUndead Minion:4:20:SPEED-3,INCREASE_DAMAGE-1'
          - '5;CAGE:WATER:STONE:30'
          - '5;CAGE:LAVA:STONE:30'
        PHASE:
          - 'POTION:INCREASE_DAMAGE:3:BOSS'
          - 'POTION:SPEED:5:BOSS'
          - 'IMMUNE:SWORD###IMMUNE:PROJECTILE###IMMUNE:AXE:<message=50>&f&l(&6&lYijki, World Destroyer&f&l) &fYijki has activated Potions only! You can only damage him using potions</message>'
  4:
    min-health: 1000
    max-health: 1399
    target-type: "RANDOM"
    effects:
      overall-chance: 30
      values:
        DEFENSE:
          - '20;MINIONS:WITHER_SKELETON:15:DIAMOND:5:&c&lUndead Minion:4:20:SPEED-3,INCREASE_DAMAGE-1'
          - '5;CAGE:WATER:STONE:30'
          - '5;CAGE:LAVA:STONE:30'
        PHASE:
          - 'POTION:INCREASE_DAMAGE:3:BOSS'
          - 'POTION:SPEED:5:BOSS'
          - 'MIRROR:50:1'
  5:
    min-health: 500
    max-health: 999
    target-type: "RANDOM"
    effects:
      overall-chance: 30
      values:
        DEFENSE:
          - '20;MINIONS:WITHER_SKELETON:15:DIAMOND:5:&c&lUndead Minion:4:20:SPEED-3,INCREASE_DAMAGE-1'
          - '5;CAGE:WATER:STONE:30'
          - '5;CAGE:LAVA:STONE:30'
        PHASE:
          - 'POTION:INCREASE_DAMAGE:3:BOSS'
          - 'POTION:SPEED:5:BOSS'
          - 'IMMUNE:SWORD###IMMUNE:PROJECTILE###IMMUNE:POTION:<message=50>&f&l(&6&lYijki, World Destroyer&f&l) &fYijki has activated Axes only! You can only damage him using axes</message>'
  6:
    min-health: 0
    max-health: 499
    target-type: "RANDOM"
    effects:
      overall-chance: 30
      values:
        DEFENSE:
          - '20;MINIONS:WITHER_SKELETON:15:DIAMOND:5:&c&lUndead Minion:4:20:SPEED-3,INCREASE_DAMAGE-1'
          - '5;CAGE:WATER:STONE:30'
          - '5;CAGE:LAVA:STONE:30'
        PHASE:
          - 'POTION:INCREASE_DAMAGE:3:BOSS'
          - 'POTION:SPEED:5:BOSS'
          - 'IMMUNE:AXE###IMMUNE:PROJECTILE###IMMUNE:POTION:<message=50>&f&l(&6&lYijki, World Destroyer&f&l) &fYijki has activated Swords only! You can only damage him using swords</message>'

# Set the equipment the boss uses
# The following values are used
# weapon, helmet, chestplate, leggings and boots
#
# To use coloured leather just set LEATHER_<TYPE>:R,G,B
# example: LEATHER_CHESTPLATE:255,0,0
#
# Note: Some mobs do not show the armor but will have it on ie. Spiders etc.
equipment:
  weapon:
    material: "DIAMOND_SWORD" # Material of item
    enchants: # Vanilla enchantments - 'ENCHANT:LEVEL'
      - 'DAMAGE_ALL:5'
  helmet:
    material: "DIAMOND_HELMET"
    enchants:
      - 'PROTECTION_ENVIRONMENTAL:3'
  chestplate:
    material: "DIAMOND_CHESTPLATE"
    enchants:
      - 'PROTECTION_ENVIRONMENTAL:3'
  leggings:
    material: "DIAMOND_LEGGINGS"
    enchants:
      - 'PROTECTION_ENVIRONMENTAL:3'
  boots:
    material: "DIAMOND_BOOTS"
    enchants:
      - 'PROTECTION_ENVIRONMENTAL:3'

# Item is the spawn item that can be used to spawn the boss
# If you do not want this then just don't give it to players since that
# is the only way they can obtain it
item:
  material: "ENDERMAN_SPAWN_EGG"
  name: "&6&lYijki, World Destroyer"
  lore:
    - '&7This monster egg contains a'
    - '&c&ndangerous&7 warzone boss'
    - ''
    - '&6&lLORE'
    - '&7&oAn entity with powers on paar with'
    - '&7&othe god of destruction itself. No'
    - '&7&oheroes in recorded Cosmonaut'
    - '&7&ohistory have faced this absolute'
    - '&7&oevil and lived to tell the tale.'
    - ''
    - '&6&lDIFFICULTY'
    - '&6Legendary++'
settings:
  # Worlds where the boss cannot spawn (via item)
  blocked-worlds:
    - 'test'
  # Regions where the boss cannot spawn (via item)
  blocked-regions:
    - 'example-region'
  boss-distance:
    distance: 75 # Distance the boss can move from their spawn before they are teleport back
    send-message: true # Send a message to players in the radius to tell them the boss has been teleported back
  player-spawn: true # Can players spawn the boss via item? Ops bypass this even if it is disabled
  warzone-only: false # Bosses can only be spawned in the warzone, if they are spawned and walk out of the warzone they
  # are teleported back.
  # Requires Factions

# Congrats you have made it to the end of the config, enjoy your creation. I hope to see some great bosses made by this plugin!