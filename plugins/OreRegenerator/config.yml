# Should global regions generate automatically?
generate-global-regions: true
# Should block timers continue after the server restarts?
persistent-timers: true
# ONLY MODIFY THESE IF YOU KNOW WHAT YOU'RE DOING
advanced:
  alternatives:
    # Should we use an alternative method of putting items into the player's inventory?
    # Turn on if the default method isn't working properly for you
    auto-inventory: true
  converters:
    # Convert data from other plugins to OreRegenerator data
    # After enabling a converter, restart the server
    ultimate-regen:
      # Should we convert data from UltimateRegen?
      enabled: false
      # Should we remove the data from UltimateRegen after converting it?
      # This is recommended to avoid potential re-conversion
      remove-data: false
    minexfarm-regen:
      # Should we convert data from MineXFarm Regen?
      enabled: false
      # Should we remove the data from MineXFarm Regen after converting it?
      # This is recommended to avoid potential re-conversion
      remove-data: false
# NEVER MODIFY THIS
version: 4
