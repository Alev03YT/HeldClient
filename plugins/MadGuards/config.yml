# =========================================================
# MadGuards — Cosmic-style prison guards
# Notes:
# - Distances are in blocks.
# - Time is in seconds unless noted.
# - Color codes (§) are supported in messages.
# - Material names must be valid Spigot/Paper Material keys.
# =========================================================

# === GUARD SETTINGS ===
guard:
  # Per-tier stats (used when you spawn a guard of that type).
  # Type IDs: 1 = WARDEN, 2 = ENFORCER, 3 = GUARD
  warden:
    health: 1000             # Max HP for Wardens (toughest tier)
    damage: 40.0             # Melee damage per hit
    attack-rate: 10          # Sentinel attack speed (lower = faster)

  enforcer:
    health: 250
    damage: 10.0
    attack-rate: 5

  guard:
    health: 100
    damage: 7.5
    attack-rate: 5

  # Global AI behavior (applies to all guards)
  chase-range: 999999            # How far guards will chase a target
  close-chase: true          # Keep very close while chasing
  fightback: true            # Guards retaliate when hit
  needs-ammo: false          # Only for ranged NPCs (unused here). Keep false.
  realistic-sight: false     # If true, needs line-of-sight to “see” targets
  invulnerable: false        # If true, guards can’t be damaged
  reset-health-on-death: true # Heal guards back after kills/resets
  intimidation-cooldown-ms: 15000
  single-guard-pursuit: true

  # Ranges
  intimidation-radius: 5.0   # When a targeted player is this close: play effects once
  reaction-radius: 20.0      # A guard reacts ONLY if its *spawn* is within this
                             # radius of a crime/contraband holder

  # === GUARD EFFECTS ON TARGET PLAYER ===
  effects:
    lightning: true          # Lightning *effect* (no damage) on first close contact
    sound-growl: true        # Ender dragon growl
    sound-thunder: true      # Thunder boom
    flames: true             # Flame particles around the target
    title: true              # Big red “You’re being hunted” title

# === VILLAIN SETTINGS ===
  villain:
    duration-seconds: 900
    block-commands:
      - spawn
      - home
      - warp
      - tpa
      - cell
    flag-on-any-attack: true   # <— NEW: attacker becomes VILLAIN even if no guard is nearby

  regen:
    enabled: true
    out-of-combat-delay-seconds: 7   # wait this long after last hit
    heal-amount: 1.0                 # how much to heal each tick (1.0 = half heart)
    period-ticks: 40                 # how often to heal (40 = 2s)


# === EQUIPMENT LOADOUT ===
# Visual gear applied to guards (purely cosmetic for the NPC).
# Use valid Material names: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
# === EQUIPMENT LOADOUT ===
# Visual gear only (Sentinel damage is configured separately)
equipment:
  # Fallbacks used if a per-type value isn't set
  default:
    helmet: "IRON_HELMET"
    chestplate: "IRON_CHESTPLATE"
    leggings: "IRON_LEGGINGS"
    boots: "IRON_BOOTS"
    weapon: "IRON_SWORD"
    offhand: "AIR"

  # Per-type overrides (optional)
  warden:
    helmet: "NETHERITE_HELMET"
    chestplate: "NETHERITE_CHESTPLATE"
    leggings: "NETHERITE_LEGGINGS"
    boots: "NETHERITE_BOOTS"
    weapon: "NETHERITE_SWORD"
    offhand: "SHIELD"

  enforcer:
    helmet: "DIAMOND_HELMET"
    chestplate: "DIAMOND_CHESTPLATE"
    leggings: "DIAMOND_LEGGINGS"
    boots: "DIAMOND_BOOTS"
    weapon: "DIAMOND_SWORD"

  guard:
    helmet: "CHAINMAIL_HELMET"
    chestplate: "CHAINMAIL_CHESTPLATE"
    leggings: "CHAINMAIL_LEGGINGS"
    boots: "CHAINMAIL_BOOTS"
    weapon: "IRON_SWORD"

# === NAMEPLATE DISPLAY ===
# Name shown above each guard, with a live health bar.
nameplate:
  warden-name: "§4§lWarden"
  enforcer-name: "§c§lEnforcer"
  guard-name: "§6§lGuard"
  heart-symbol: "§4♥"
  format: "%name% %heart% %health%/%max%"   # Tokens: %name% %heart% %health% %max%

# === IN-GAME MESSAGES ===
# You can use color codes (§) and Unicode.
messages:
  guard-targeting: "§cThe guard is targeting you!"              # You hit a guard / you’re now a target
  guard-noticed-crime: "§cA guard has noticed your crime!"       # You attacked a player in guard range
  guard-retaliate: "§cA guard is retaliating!"                   # /simulateattack feedback (attacker)
  guard-defend: "§aA guard is defending you!"                    # /simulateattack feedback (victim)
  guard-fightback-disabled: "§7You hit a guard. §eFightback is disabled§7, they won't retaliate." 
  hunted-title: "§4⚡ YOU’RE BEING HUNTED ⚡"                    # Big title when intimidation triggers
  hunted-subtitle: "§cA Mad Guard is near!"                     # Subtitle under the title

# === COMMAND SETTINGS ===
commands:
  simulate-attack-enabled: true   # Toggle for /simulateattack (testing tool)

# === PLACEHOLDERAPI + BBB WATERMARK SETTINGS ===
# Placeholders:
#   %madguards_near_guard% -> near-guard-message / no-guard-message
#   %madguards_villain%    -> "§c§lVILLAIN" or empty
# Also toggles logging of BBB watermark placeholders (480131 etc) on enable.
placeholders:
  enabled: true
  near-guard-message: "§cNEAR GUARD"
  no-guard-message: "§aNO GUARDS NEARBY"

# === CONTRABAND (Cosmic-style) ===
# If a player holds/wears contraband within reaction-radius of any guard:
#   1) Start a countdown (warn-seconds),
#   2) If they still have it when time is up -> do "action":
#        - confiscate: remove illegal items/armor
#        - aggro: mark as VILLAIN and make guards target them
contraband:
  enabled: true
  warn-seconds: 3
  action: confiscate           # Options: confiscate | aggro

  # Hand/Offhand items considered illegal near guards.
  items:
    - ENDER_PEARL
    - BOW
    - TIPPED_ARROW
    - TNT
    - LAVA_BUCKET

  # Armor pieces not allowed to be worn near guards.
  armor:
    blocked:
      - NETHERITE_HELMET
      - NETHERITE_CHESTPLATE
      - NETHERITE_LEGGINGS
      - NETHERITE_BOOTS

# === DEATH HANDLING (GUARD KILLS ONLY) ===
# What happens to the *victim’s* items when the killer is a guard NPC:
#   burn -> delete inventory with a short flame/smoke effect (Cosmic-style)
#   drop -> force vanilla style drops on the ground (ignores keepInventory gamerule)
#   keep -> keep entire inventory (no drops)
death:
  on-guard-kill:
    mode: drop                 # Options: burn | drop | keep
    burn-visuals: true         # Only used by mode: burn (visuals on delete)
    keep-experience: true      # Keep XP level on death (drop 0 XP)

# === GUARD SKINS ===
guard-skin:
  enabled: true

  warden:
    name: "WardenSkin"
    texture: ""
    signature: ""

  enforcer:
    name: "EnforcerSkin"
    texture: ""
    signature: ""

  guard:
    name: "GuardSkin"
    texture: ""
    signature: ""